# CONTACT page words. Your email and links are in site-content/about/bio.md.

title: Book a call.
statement: A free 30 minute call, with no pitch deck needed. I’d love to hear about your brand and what you’re looking for.

steps:
  - Pick a time that suits you. It shows in your own time zone.
  - Send me links to your channel or project, if you have them.
  - We talk it through. We don’t have to get into money for now.

location_line: Email or Instagram, whichever you like. I usually reply right away.
