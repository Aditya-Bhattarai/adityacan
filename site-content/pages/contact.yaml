# CONTACT page words. Your email and links are in site-content/about/bio.md.

title: Book a call.
statement: A free 30 minute call. Send me your channel or project, and I’ll come with a short plan made just for your work. It’s yours to keep, whether we work together or not.

steps:
  - Pick a time that suits you. It shows in your own time zone.
  - Send me links to your channel or project, if you have them.
  - We talk it through. We don’t have to get into money for now.

location_line: WhatsApp, email or Instagram, whichever you like. I usually reply right away.
