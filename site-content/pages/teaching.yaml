courses:
  - kicker: LIVE COURSE
    title: Premiere Pro for creators
    text: Eight days, two hours a day, for people making reels and online videos. We did a Q&A every day, and I gave out practice footage, SFX packs, project files, presets and two new shortcuts a day.
    tags: [8 days, Premiere Pro, Reels]
    project: premiere-pro-course
  - kicker: CLASSROOM
    title: Editing for social media
    text: A classroom course in seven modules, all about editing short videos for social media.
    tags: [7 modules, Short form]
    project: social-media-editing-course
  - kicker: COMMUNITY
    title: Social media for older adults
    text: Classes for older people who never grew up with social media. We start with what it is and why people use it, then how to use it.
    tags: [Older adults, Community]
    project: senior-digital-literacy

