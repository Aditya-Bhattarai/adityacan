# TEACHING chapter words. The chapter number comes from chapters.yaml.

statement: I teach what took me years to figure out.

frame:
  kicker: MY MAIN COURSE
  title: Frame
  text: My video editing course. 18 modules over three levels, starting in CapCut and ending in After Effects and colour grading. I also ran it live as Premiere Pro for creators, eight days, two hours a day, with a Q&A every day and practice footage, SFX packs, project files and presets to keep.
  curriculum_link: "[View curriculum link]"
