    - number: "02"
      title: Professional
      text: Moving to Premiere Pro, working with sound and cutting a story.
    - number: "03"
      title: Advanced
      text: Motion graphics in After Effects, and colour grading.

courses:
  - kicker: CLASSROOM AND COMMUNITY
    title: Social media and editing classes
    text: A seven module classroom course on editing short videos for social media, and classes for older people who never grew up with social media, including content classes at a community homestay. We start with what it is and why people use it, then how to use it.
