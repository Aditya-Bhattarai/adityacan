# SERVICES & PROCESS page words. No prices anywhere.

title: Strategy and story from the same person.
statement: I plan your content like a strategist, make it like a filmmaker, then read the data and make the next one better.

comparison:
  - them: Agencies edit what you send them.
    me: I shape the story for each platform before anything gets cut.
  - them: Consultants talk about going viral.
    me: I set up a way of working your team can repeat every month.
  - them: Freelancers fix the video in front of them.
    me: I look at your audience, structure and workflow, then shoot and cut it myself.

services:
  - title: Content strategy & audits
    text: I audit your channels against platform data, find out why strong ideas underperform, and write a playbook your team can repeat.
    outputs: [Audit, Playbook, Content calendar]
  - title: Long form editing
    text: YouTube explainers, interviews and podcasts, structured to hold attention and paced like a film.
    outputs: [YouTube, Podcasts, Interviews]
  - title: Short form systems
    text: Reels and shorts cut from every long video, with hooks written for each platform.
    outputs: [Reels, Shorts, Repurposing]
  - title: Thumbnails & covers
    text: Titles, thumbnails and vertical covers designed together, so people click.
    outputs: [YouTube thumbnails, Vertical covers]
  - title: Motion graphics
    text: Data animations and explainer graphics that make numbers easy to follow.
    outputs: [Charts, Lower thirds, Titles]
  - title: Direction & production
    text: Concept, script, shot list, call sheet and shoot for brand films and campaigns.
    outputs: [Brand films, Scripts, On set]
  - title: Film & documentary editing
    text: Narrative and documentary edits with sound design and colour.
    outputs: [Documentary, Short film, Colour]

process:
  - when: WEEK 1
    title: Audit
    text: Your channels, data and audience. What works, what doesn’t and why.
  - when: WEEK 1
    title: Strategy
    text: Positioning, formats and a calendar built for your platforms.
  - when: WEEK 2
    title: Preproduction
    text: Scripts, hooks and shot lists, planned like a film.
  - when: ONGOING
    title: Shoot & edit
    text: The long version first, then every short you can cut from it.
  - when: ONGOING
    title: Package
    text: Titles, thumbnails, covers and captions, ready to post.
  - when: MONTHLY
    title: Review
    text: We read the numbers together and improve the next batch.

ways:
  - kicker: ONE PROJECT
    title: A single project
    text: One film, one campaign or one channel audit, scoped from start to finish.
  - kicker: ONGOING
    title: Monthly content partner
    text: Strategy, editing and packaging every month, the way an in house team would do it.
  - kicker: FILM
    title: Film & production
    text: Direction, production and editing for brand films, documentaries and short films.

# Questions with [brackets] in the answer stay hidden until you fill them in.
faq:
  - question: Do you work with clients outside Nepal?
    answer: Yes. I’m in Kathmandu (GMT+5:45) and work remotely with clients worldwide.
  - question: How do we get started?
    answer: Book a free 30 minute call. I’d love to hear about your brand, your work and what you’re looking for. We can just talk it through, and we don’t have to get into money for now.
  - question: What languages do you work in?
    answer: "[Nepali and English: confirm.]"
  - question: How do payments work?
    answer: "[Bank / SWIFT transfer: confirm.]"
  - question: How fast is turnaround?
    answer: "[Typical turnaround per format.]"
  - question: How many revisions are included?
    answer: "[Your revision policy.]"

cta:
  title: Tell me what you’re making.
  button: Book a free 30 minute call
