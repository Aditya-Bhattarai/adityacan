process:
  - when: WEEK 1
    title: Audit
    text: I go through your channels and numbers and tell you honestly what’s working.
  - when: WEEK 1
    title: Strategy
    text: We decide what you want to be known for, which formats to make and when they go out.
  - when: WEEK 2
    title: Preproduction
    text: Scripts, hooks and shot lists, all sorted before the shoot.
  - when: ONGOING
    title: Shoot & edit
    text: The long version first, then every short you can cut from it.
  - when: ONGOING
    title: Package
    text: Titles, thumbnails, covers and captions, ready to post.
  - when: MONTHLY
    title: Review
    text: We look at the numbers together and change what the next batch needs.

ways:
  - kicker: ONE PROJECT
    title: A single project
    text: One film, one campaign or one channel audit, with a clear start and end.
  - kicker: ONGOING
    title: Monthly content partner
    text: Strategy, editing and thumbnails every month, like having someone in house.
  - kicker: FILM
    title: Film & production
    text: Brand films, documentaries and short films. I can direct, produce, edit or do all three.

# Questions with [brackets] in the answer stay hidden until you fill them in.
faq:
  - question: Do you work with clients outside Nepal?
    answer: Yes. I’m in Kathmandu and we’d work together online.
  - question: How do we get started?
    answer: Book a free 30 minute call. I’d love to hear about your brand, your work and what you’re looking for. We can just talk it through, and we don’t have to get into money for now.
  - question: What do you need from me to get started?
    answer: Links to your channel or past work, what you want people to do after watching, and any footage you already have. We can sort out the rest on the call.
  - question: Can you work with footage I’ve already shot?
    answer: Yes. Send me what you have and I’ll tell you honestly what it can become.
  - question: Do you only edit, or can you plan and shoot too?
    answer: I can do all three. I can plan what you should make, shoot it and edit it, or just take on the part you need.
  - question: Can we start with one video before committing to more?
    answer: Yes. Most people start with a single project and keep going if it works for them.
  - question: How do we stay in touch while you work?
    answer: WhatsApp, email or Instagram, whichever you like, and a quick call whenever something needs talking through.
  - question: What languages do you work in?
    answer: "[Nepali and English: confirm.]"
  - question: How do payments work?
    answer: "[Bank / SWIFT transfer: confirm.]"
  - question: How fast is turnaround?
    answer: "[Typical turnaround per format.]"
  - question: How many revisions are included?
    answer: "[Your revision policy.]"

cta:
  title: Tell me what you’re making.
  button: Book a free 30 minute call
