# SERVICES & PROCESS page words. No prices anywhere.

title: Strategy and story from the same person.
statement: I plan what you should make, make it, see how it did, and use that to make the next one better.

comparison:
  - them: You send footage and get an edit back.
    me: We talk about what the video is for before anyone cuts anything.
  - them: You get a deck full of advice, then you’re on your own.
    me: You get a plan your team can actually keep up with every month.
  - them: One video gets better and the channel stays the same.
    me: I look at the whole channel first, then shoot and cut it myself.

services:
  - title: Content strategy & audits
    text: I go through your channels and numbers, work out why good ideas aren’t landing, and write it all down so your team can use it.
    outputs: [Audit, Written plan, Content calendar]
  - title: Long form editing
    text: YouTube explainers, interviews and podcasts, cut so people keep watching.
    outputs: [YouTube, Podcasts, Interviews]
  - title: Reels and shorts
    text: I cut reels and shorts out of every long video, and write a hook for each one.
    outputs: [Reels, Shorts, Repurposing]
  - title: Thumbnails & covers
    text: I do the title and thumbnail together, because that’s what decides if anyone clicks.
    outputs: [YouTube thumbnails, Vertical covers]
  - title: Motion graphics
    text: Animated charts and graphics, so a video full of numbers is still easy to follow.
    outputs: [Charts, Lower thirds, Titles]
  - title: Direction & production
    text: Brand films and campaigns, from the first idea and the script through to the shoot.
    outputs: [Brand films, Scripts, On set]
  - title: Film & documentary editing
    text: Short films and documentaries, including the sound and the colour.
    outputs: [Documentary, Short film, Colour]

